apiVersion: v1
kind: ConfigMap
metadata:
  name: os-service-config
  namespace: autocenter
data:
  DB_URL: "jdbc:mysql://os-mysql:3306/os_service?useSSL=false&allowPublicKeyRetrieval=true"
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  DD_TRACE_ENABLED: "false"
  DD_INSTRUMENTATION_TELEMETRY_ENABLED: "false"
  DD_ENV: "prod"
  DD_SERVICE: "os-service"
  DD_VERSION: "1.0.0"
  DD_LOGS_INJECTION: "true"
  JAVA_OPTS: "-javaagent:/app/dd-java-agent.jar -XX:MaxRAMPercentage=60 -XX:+ExitOnOutOfMemoryError"
