apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: os-mysql-pvc
  namespace: autocenter
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: os-mysql
  namespace: autocenter
spec:
  selector:
    app: os-mysql
  ports:
    - port: 3306
      targetPort: 3306
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: os-mysql
  namespace: autocenter
  labels:
    app: os-mysql
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: os-mysql
  template:
    metadata:
      labels:
        app: os-mysql
    spec:
      enableServiceLinks: false
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_DATABASE
              value: os_service
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: {name: os-service-secrets, key: MYSQL_ROOT_PASSWORD}
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef: {name: os-service-secrets, key: DB_USERNAME}
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef: {name: os-service-secrets, key: DB_PASSWORD}
          resources:
            requests: {cpu: "100m", memory: "384Mi"}
            limits: {memory: "768Mi"}
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\""]
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 20
          livenessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\""]
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: dados
              mountPath: /var/lib/mysql
      volumes:
        - name: dados
          persistentVolumeClaim:
            claimName: os-mysql-pvc
