apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: os-service
  namespace: autocenter
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /v1/ordem-servicos
            pathType: Prefix
            backend:
              service:
                name: os-service
                port:
                  number: 8098
          - path: /swagger-ui
            pathType: Prefix
            backend:
              service:
                name: os-service
                port:
                  number: 8098
          - path: /v3/api-docs
            pathType: Prefix
            backend:
              service:
                name: os-service
                port:
                  number: 8098
