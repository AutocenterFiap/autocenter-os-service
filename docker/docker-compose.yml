services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: os_service
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNO://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNO://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNO:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 10s
      retries: 20

  kafka-topicos:
    image: apache/kafka:3.8.0
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    network_mode: "service:kafka"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        for t in os.eventos billing.comandos execucao.comandos billing.eventos execucao.eventos \
                 billing.eventos.dlt execucao.eventos.dlt; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --create --if-not-exists \
            --topic "$$t" --partitions 3 --replication-factor 1
        done

  os-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: os-service:compose
    depends_on:
      mysql:
        condition: service_healthy
      kafka-topicos:
        condition: service_completed_successfully
    ports:
      - "8098:8098"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/os_service?useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: root
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SISTEMA_SEGURANCA_CHAVE_SECRETA: ${SISTEMA_SEGURANCA_CHAVE_SECRETA:?defina SISTEMA_SEGURANCA_CHAVE_SECRETA}
      SAGA_PAGAMENTO_VALIDADE_MINUTOS: ${SAGA_PAGAMENTO_VALIDADE_MINUTOS:-30}
