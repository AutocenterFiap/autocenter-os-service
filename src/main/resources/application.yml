server:
  port: 8098

spring:
  application:
    name: os-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/os_service}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true

saga:
  pagamento:
    validade-minutos: 30
    max-tentativas: 3

cadastro:
  modo: stub

sistema:
  seguranca:
    chave:
      secreta: ${SISTEMA_SEGURANCA_CHAVE_SECRETA}
